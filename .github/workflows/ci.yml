name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# NHL fork policy: this fork is a thin, transitional layer over upstream
# observeinc/cli. Upstream verifies the full CLI against their full tenant +
# full API spec (introspection on) in THEIR CI — we can't reproduce that (our
# tenant exposes a subset and has GraphQL introspection disabled, so the
# committed generated SDK is intentionally trimmed and a full `tsc` over the
# upstream source can never pass here). Chasing that green is wasted effort for
# a signal nobody at NHL relies on.
#
# So this gate is intentionally minimal: it only proves the binary BUILDS
# (bundler transpile — what actually ships). Behavioral/regression testing that
# NHL cares about lives in mop-cli (against our tenant). See the fork's
# strategy notes; the net-add here is a handful of thin command wrappers that
# are migrating into mop-cli over time.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # Build only — NOT `bun run test` (typecheck/lint/format over upstream's
      # full source is coupled to their tenant/spec; see header). codegen is
      # skipped because the generated SDK is committed.
      - run: bun run build
        env:
          OBSERVE_OPENAPI_SPEC: ${{ secrets.OBSERVE_OPENAPI_SPEC }}
          OBSERVE_GQL_TOKEN: ${{ secrets.OBSERVE_GQL_TOKEN }}
          OBSERVE_GQL_SPEC: ${{ secrets.OBSERVE_GQL_SPEC }}
